name: Native Prebuilt Update Manifest

on:
  workflow_call:
    inputs:
      config:
        required: true
        type: string

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dart run native_prebuilt manifest update --config ${{ inputs.config }} --output lib/src/hook/asset_hashes.dart
