name: native_prebuilt
description: >-
  Reusable infrastructure for Dart packages that ship prebuilt native libraries
  from GitHub or GitLab releases. Provides build-hook integration, manifest
  generation, download/verify/cache pipelines, and binary validation.
version: 0.0.8

repository: https://github.com/kingwill101/native_prebuilt
homepage: https://github.com/kingwill101/native_prebuilt
issue_tracker: https://github.com/kingwill101/native_prebuilt/issues

topics:
  - native
  - prebuilt
  - build-hook
  - code-assets

environment:
  sdk: ^3.10.4

executables:
  native_prebuilt: native_prebuilt

dependencies:
  archive: ^4.0.9
  artisanal: ^0.4.0
  code_assets: ^1.2.1
  crypto: ^3.0.6
  hooks: ^2.1.0
  logging: ^1.3.0
  path: ^1.9.1
  yaml: ^3.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  http: ^1.2.0
  test: ^1.25.8
